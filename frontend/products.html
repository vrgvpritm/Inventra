<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventra | Products</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="products.css">
</head>

<body>

<div class="container">
    
    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-cubes-stacked"></i>
            <h2>Inventra</h2>
        </div>

        <ul>

            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <li class="active">
                <a href="products.html">
                    <i class="fa-solid fa-box"></i>
                    <span>Products</span>
                </a>
            </li>

            <li>
                <a href="inventory.html">
                    <i class="fa-solid fa-warehouse"></i>
                    <span>Inventory</span>
                </a>
            </li>

            <li>
                <a href="suppliers.html">
                    <i class="fa-solid fa-truck"></i>
                    <span>Suppliers</span>
                </a>
            </li>

            <li>
                <a href="sales.html">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Sales</span>
                </a>
            </li>

            <li>
                <a href="reports.html">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Reports</span>
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </li>

        </ul>

    </aside>

    <div class="main">

        <header>

            <div>

                <h1>Products</h1>

                <p>Manage all products stored in Inventra</p>

            </div>

            <button id="addProductBtn">

                <i class="fa-solid fa-plus"></i>

                Add Product

            </button>

        </header>

        <div class="toolbar">

            <div class="search">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search products..."
                >

            </div>

            <select id="categoryFilter">

                <option value="All">All Categories</option>

                <option value="Electronics">Electronics</option>

                <option value="Accessories">Accessories</option>

                <option value="Furniture">Furniture</option>

                <option value="Stationery">Stationery</option>

            </select>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>SKU</th>

                        <th>Name</th>

                        <th>Category</th>

                        <th>Supplier</th>

                        <th>Price</th>

                        <th>Stock</th>

                        <th>Status</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="productTable">

                    <!-- Products will come from MySQL -->

                </tbody>

            </table>

        </div>

        <!-- Add/Edit Modal -->

        <div class="modal" id="productModal">

            <div class="modal-content">

                <div class="modal-header">

                    <h2 id="modalTitle">
                        Add Product
                    </h2>

                    <span class="close">&times;</span>

                </div>

                <form id="productForm">

                    <input type="hidden" id="productId">

                    <div class="form-group">

                        <label>Product Name</label>

                        <input
                            type="text"
                            id="name"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label>SKU</label>

                        <input
                            type="text"
                            id="sku"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label>Category</label>

                        <select id="category">
                                                        <option value="10">Electronics</option>

                            <option value="13">Accessories</option>

                            <option value="11">Furniture</option>

                            <option value="12">Stationery</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Supplier</label>

                        <select id="supplier">

                            <option value="4">ABC Technologies</option>

                            <option value="5">Tech World</option>

                        </select>

                    </div>

                    <div class="form-row">

                        <div class="form-group">

                            <label>Price (₹)</label>

                            <input
                                type="number"
                                id="price"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>Stock</label>

                            <input
                                type="number"
                                id="stock"
                                required
                            >

                        </div>

                    </div>

                    <div class="form-group">

                        <label>Description</label>

                        <textarea
                            id="description"
                            rows="4"
                            placeholder="Enter product description..."
                        ></textarea>

                    </div>

                    <div class="modal-buttons">

                        <button
                            type="button"
                            id="cancelBtn"
                            class="secondary-btn"
                        >
                            Cancel
                        </button>

                        <button
                            type="submit"
                            class="primary-btn"
                        >
                            Save Product
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<script src="products.js"></script>

</body>

</html>
