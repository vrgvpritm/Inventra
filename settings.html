<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventra | Settings</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="settings.css">

</head>

<body>

<div class="container">

<aside class="sidebar">

<div class="logo">

<i class="fa-solid fa-cubes-stacked"></i>

<h2>Inventra</h2>

</div>

<ul>

<li onclick="location.href='dashboard.html'">

<i class="fa-solid fa-house"></i>

<span>Dashboard</span>

</li>

<li onclick="location.href='products.html'">

<i class="fa-solid fa-box"></i>

<span>Products</span>

</li>

<li onclick="location.href='inventory.html'">

<i class="fa-solid fa-warehouse"></i>

<span>Inventory</span>

</li>

<li onclick="location.href='suppliers.html'">

<i class="fa-solid fa-truck"></i>

<span>Suppliers</span>

</li>

<li onclick="location.href='sales.html'">

<i class="fa-solid fa-cart-shopping"></i>

<span>Sales</span>

</li>

<li onclick="location.href='reports.html'">

<i class="fa-solid fa-chart-column"></i>

<span>Reports</span>

</li>

<li class="active">

<i class="fa-solid fa-gear"></i>

<span>Settings</span>

</li>

</ul>

</aside>

<div class="main">

<header>

<div>

<h1>Settings</h1>

<p>Manage your account and system preferences</p>

</div>

<button id="saveSettings">

<i class="fa-solid fa-floppy-disk"></i>

Save Changes

</button>

</header>

<div class="settings-grid">

<div class="card">

<h2>Profile Information</h2>

<div class="form-group">

<label>Full Name</label>

<input type="text" value="Administrator">

</div>

<div class="form-group">

<label>Email</label>

<input type="email" value="vargavprtm@gmail.com">

</div>

</div>

<div class="card">

<h2>Security</h2>

<div class="form-group">

<label>Current Password</label>

<input type="password">

</div>

<div class="form-group">

<label>New Password</label>

<input type="password">

</div>

</div>

<div class="card">

<h2>Company Information</h2>

<div class="form-group">

<label>Company Name</label>

<input type="text" value="Inventra">

</div>

<div class="form-group">

<label>Company Address</label>

<input type="text" value="Guwahati, Assam">

</div>

</div>

<div class="card">

<h2>Preferences</h2>

<div class="form-group">

<label>Theme</label>

<select>

<option>Light</option>

<option>Dark</option>

</select>

</div>

<div class="form-group">

<label>Notifications</label>

<select>

<option>Enabled</option>

<option>Disabled</option>

</select>

</div>

</div>

</div>

</div>

</div>

<script src="settings.js"></script>

</body>

</html>
